[package]
name = "fivebx-server"
version = "0.1.0"
edition = "2021"
authors = ["5BX Project Team"]
description = "Royal Canadian Air Force 5BX Fitness Plan Web Application Server"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8.1", features = ["json", "matched-path"] }
axum-extra = { version = "0.10.0", features = ["cookie"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
chrono = { version = "0.4.39", features = ["serde"] }
time = "0.3"
bcrypt = "0.17.0"
jsonwebtoken = "9.3.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
dotenvy = "0.15.7"
rust-embed = { version = "8.5.0", features = ["axum"] }
mime_guess = "2.0.5"
uuid = { version = "1.15.1", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
